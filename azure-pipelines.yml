trigger:
  branches:
    include:
      - main
      - feature/build-pipeline

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: sdk
    version: 10.0.302

- task: SonarCloudPrepare@4
  displayName: Prepare SonarQube Cloud analysis
  inputs:
    SonarQube: SonarCloud
    organization: jacques1650
    scannerMode: dotnet
    projectKey: modernwebapp
    projectName: Modern Web Application Platform

- script: dotnet restore ModernWebApp.slnx
  displayName: Restore dependencies

- script: dotnet build ModernWebApp.slnx --configuration $(buildConfiguration) --no-restore
  displayName: Build application

- script: dotnet test ModernWebApp.slnx --configuration $(buildConfiguration) --no-build
  displayName: Run unit tests

- task: SonarCloudAnalyze@4
  displayName: Run SonarQube Cloud analysis

- task: SonarCloudPublish@4
  displayName: Publish SonarQube Cloud quality gate
  inputs:
    pollingTimeoutSec: '300'