trigger:
  branches:
    include:
      - main
      - feature/build-pipeline

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

stages:
- stage: Build
  displayName: Build Stage

  jobs:
  - job: Build_API
    displayName: Build ModernWebApp

    steps:
    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        version: 10.0.302

    - task: SonarCloudPrepare@4
      displayName: Prepare SonarQube Cloud analysis
      condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest'))
      inputs:
        SonarQube: SonarCloud
        organization: jacques1650
        scannerMode: dotnet
        projectKey: jacques1650_modernwebapp
        projectName: Modern Web Application Platform

    - script: dotnet restore ModernWebApp.slnx
      displayName: Restore dependencies

    - script: dotnet build ModernWebApp.slnx --configuration $(buildConfiguration) --no-restore
      displayName: Build application

    - script: dotnet test ModernWebApp.slnx --configuration $(buildConfiguration) --no-build
      displayName: Run unit tests

    - task: SonarCloudAnalyze@4
      displayName: Run SonarQube Cloud analysis
      condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest'))

    - task: SonarCloudPublish@4
      displayName: Publish SonarQube Cloud quality gate
      condition: or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.Reason'], 'PullRequest'))
      inputs:
        pollingTimeoutSec: '300'

- stage: Publish
  displayName: Publish Stage
  dependsOn: Build

  jobs:
  - job: Publish_API
    displayName: Publish ModernWebApp

    steps:      
    - task: DotNetCoreCLI@2
      displayName: Publish application
      inputs:
        command: publish
        publishWebProjects: false
        projects: src/ModernWebApp.Api/ModernWebApp.Api.csproj
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)'
        zipAfterPublish: false
 
    - task: PublishPipelineArtifact@1
      displayName: Publish pipeline artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'modernwebapp'
        publishLocation: pipeline

  - stage: Deploy_Development
    displayName: Deploy to Development
    dependsOn: Publish
    condition: succeeded()

    jobs:
    - deployment: Deploy_WebApp
      displayName: Deploy ModernWebApp to Azure App Service
      environment: Development

      strategy:
        runOnce:
          deploy:
            steps:
             - task: DownloadPipelineArtifact@2
               displayName: Download ModernWebApp artifact
               inputs:
                artifact: modernwebapp
                path: '$(Pipeline.Workspace)/modernwebapp'     
             - task: AzureWebApp@1
               displayName: Deploy to Azure Web App
               inputs:
                 azureSubscription: ModernWebApp-Azure-Dev
                 appType: webAppLinux
                 appName: modernwebapp-dev-joc
                 package: '$(Pipeline.Workspace)/modernwebapp/**/*.zip'     
